name = "my-life-story"
main = "server/index.js"
compatibility_date = "2024-10-01"

[vars]
SESSION_SECRET = "replace-me-with-a-random-secret"
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "replace-me-with-a-strong-password"

[[d1_databases]]
binding = "DB"
database_name = "my-life-story"
database_id = "replace-with-your-d1-id"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "my-life-story-media"
